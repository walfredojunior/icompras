<svg xmlns="http://www.w3.org/2000/svg" viewBox="148 153 901 935" fill-rule="evenodd" role="img" aria-label="PYIA">
<style>
  .p{fill:#000}
  .h{transform-box:fill-box;transform-origin:center;
     animation:sai var(--d) ease-in-out infinite alternate,
               pulsa calc(var(--d) + 1.4s) ease-in-out infinite;animation-delay:var(--a)}
  .g{animation:sai var(--d) ease-in-out infinite alternate,
               pulsa calc(var(--d) + 1.4s) ease-in-out infinite,
               gira calc(var(--d) * 4) linear infinite;animation-delay:var(--a)}
  .cabeca{transform-box:fill-box;transform-origin:center;animation:respira 3.8s ease-in-out infinite}
  .topo{transform-box:fill-box;transform-origin:center;animation:balanca 5s ease-in-out infinite alternate}
  /* Descansa no lugar certo e vai para FORA. Por isso o "from" é zero: a logo
     parada é exatamente a logo, sem deslocamento nenhum. */
  @keyframes sai{from{translate:0 0}to{translate:calc(var(--x)*1px) calc(var(--y)*1px)}}
  @keyframes pulsa{0%,100%{scale:1}50%{scale:1.08}}
  @keyframes gira{to{rotate:360deg}}
  @keyframes respira{0%,100%{scale:1}50%{scale:1.015}}
  @keyframes balanca{from{rotate:-1.1deg}to{rotate:1.1deg}}
  @media (prefers-reduced-motion:reduce){.h,.g,.cabeca,.topo{animation:none}}
</style>
